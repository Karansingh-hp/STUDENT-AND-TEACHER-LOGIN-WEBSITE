<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events · Westfield Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root"></div>
  <div id="toast" class="toast"><i class="fas fa-check-circle"></i><span id="toastMessage">Success</span></div>
  <script src="script.js"></script>
  <script>
    if (!requireAuth('student')) throw new Error();
    const content = `
      <div class="page-header"><h2><i class="fas fa-calendar-check"></i> Campus Events</h2><p>Discover upcoming events and activities.</p></div>
      <div class="events-list">
        ${DATA.events.map(e => `
          <div class="event-card">
            <div class="event-date"><div class="day">${escapeHtml(e.day)}</div><div class="month">${escapeHtml(e.month)}</div></div>
            <div class="event-info">
              <h4>${escapeHtml(e.title)}</h4>
              <p>${escapeHtml(e.description)}</p>
              <div class="event-meta">
                <span><i class="fas fa-clock"></i> ${escapeHtml(e.time)}</span>
                <span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(e.location)}</span>
                <span><i class="fas fa-tag"></i> ${escapeHtml(e.category)}</span>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
    buildLayout('events', content);
  </script>
</body>
</html>
