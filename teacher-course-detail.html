<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Detail · Faculty Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root"></div>
  <div id="toast" class="toast"><i class="fas fa-check-circle"></i><span id="toastMessage">Success</span></div>
  <script src="script.js"></script>
  <script>
    if (!requireAuth('teacher')) throw new Error();

    const content = `
      <div class="breadcrumb"><a href="teacher-courses.html">My Courses</a> <i class="fas fa-chevron-right"></i> <span>Course Detail</span></div>
      <div class="course-detail-hero" id="tcHero"></div>
      <div class="course-tabs">
        <button class="course-tab active" data-tab="overview" onclick="setTeacherCourseTab('overview')"><i class="fas fa-info-circle"></i> Overview</button>
        <button class="course-tab" data-tab="students" onclick="setTeacherCourseTab('students')"><i class="fas fa-users"></i> Students</button>
        <button class="course-tab" data-tab="modules" onclick="setTeacherCourseTab('modules')"><i class="fas fa-list-ul"></i> Modules</button>
        <button class="course-tab" data-tab="materials" onclick="setTeacherCourseTab('materials')"><i class="fas fa-folder-open"></i> Materials</button>
        <button class="course-tab" data-tab="announcements" onclick="setTeacherCourseTab('announcements')"><i class="fas fa-bullhorn"></i> Announcements</button>
      </div>
      <div id="tcTabContent"></div>
    `;

    buildLayout('teacher-courses', content);
    initTeacherCourseDetailPage();
  </script>
</body>
</html>
