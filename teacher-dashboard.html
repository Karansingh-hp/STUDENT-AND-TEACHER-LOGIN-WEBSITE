<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Faculty Dashboard · Westfield Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="root"></div>
  <div id="toast" class="toast"><i class="fas fa-check-circle"></i><span id="toastMessage">Success</span></div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/student-assignments.js"></script>
  <script src="js/teacher-assignments.js"></script>
  <script src="js/teacher-courses.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth('teacher')) return;
      const t = DATA.teacher;
      const content = `
        <div class="page-header"><h2><i class="fas fa-home"></i> Faculty Dashboard</h2><p>Welcome, ${escapeHtml(t.firstName)} ${escapeHtml(t.lastName)}.</p></div>
        <div class="stats-grid">
          ${DATA.teacherStats.map(st => `
            <a href="${st.route}" class="stat-card">
              <div class="stat-icon ${st.color}"><i class="fas ${st.icon}"></i></div>
              <h3>${escapeHtml(st.label)}</h3>
              <div class="stat-value">${escapeHtml(st.value)}</div>
            </a>
          `).join('')}
        </div>
      `;
      buildLayout('teacher-dashboard', content);
    });
  </script>
</body>
</html>
