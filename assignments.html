<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignments · Westfield Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="root"></div>
  <div id="toast" class="toast"><i class="fas fa-check-circle"></i><span id="toastMessage">Success</span></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/student-assignments.js"></script>
  <script src="js/teacher-assignments.js"></script>
  <script src="js/teacher-courses.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth('student')) return;
      const content = `
        <div class="page-header">
          <h2><i class="fas fa-tasks"></i> My Assignments</h2>
          <p>Track, manage, and submit all your assignments in one place.</p>
        </div>
        <div class="stats-grid assignment-stats">
          <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-hourglass-half"></i></div><h3>Pending</h3><div class="stat-value" id="statPending">0</div></div>
          <div class="stat-card"><div class="stat-icon red"><i class="fas fa-exclamation-triangle"></i></div><h3>Overdue</h3><div class="stat-value" id="statOverdue">0</div></div>
          <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-paper-plane"></i></div><h3>Submitted</h3><div class="stat-value" id="statSubmitted">0</div></div>
          <div class="stat-card"><div class="stat-icon green"><i class="fas fa-check-double"></i></div><h3>Graded</h3><div class="stat-value" id="statGraded">0</div></div>
        </div>
        <div class="filters-bar">
          <div class="filters-row">
            <div class="search-input">
              <i class="fas fa-search"></i>
              <input type="text" placeholder="Search assignments..." oninput="searchAssignments(this.value)">
            </div>
            <select class="filter-select" id="courseFilter"></select>
            <select class="filter-select" onchange="sortAssignments(this.value)">
              <option value="due-asc">Sort: Due Date ↑</option>
              <option value="due-desc">Sort: Due Date ↓</option>
            </select>
          </div>
        </div>
        <div class="tab-filters">
          <button class="tab-filter active" onclick="filterAssignments('all');setActiveTab(this)"><i class="fas fa-list"></i> All</button>
          <button class="tab-filter" onclick="filterAssignments('pending');setActiveTab(this)"><i class="fas fa-hourglass-half"></i> Pending</button>
          <button class="tab-filter" onclick="filterAssignments('submitted');setActiveTab(this)"><i class="fas fa-paper-plane"></i> Submitted</button>
          <button class="tab-filter" onclick="filterAssignments('graded');setActiveTab(this)"><i class="fas fa-check-double"></i> Graded</button>
        </div>
        <div class="assignments-count-bar"><span id="assignmentsCount" style="font-size:0.82rem;color:var(--text-light);font-weight:600;"></span></div>
        <div class="assignments-list-enhanced" id="assignmentsList"></div>
      `;
      buildLayout('assignments', content);
      initAssignmentsPage();

      function setActiveTab(btn) {
        document.querySelectorAll('.tab-filter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
    });
  </script>
</body>
</html>
