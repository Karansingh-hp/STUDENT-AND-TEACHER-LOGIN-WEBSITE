<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Detail · Westfield Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="root"></div>
  <div id="toast" class="toast"><i class="fas fa-check-circle"></i><span id="toastMessage">Success</span></div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/student-assignments.js"></script>
  <script src="js/teacher-assignments.js"></script>
  <script src="js/teacher-courses.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth('student')) return;

      const urlParams = new URLSearchParams(window.location.search);
      const courseId = urlParams.get('id') || 'cs201';
      
      // 🔥 IMPORTANT: Load from local storage (teacher's updated data) first!
      const savedCourses = Storage.load(STORAGE_KEYS.TEACHER_COURSES, []);
      let course = null;
      
      if (savedCourses && savedCourses.length > 0) {
        course = savedCourses.find(c => c.id === courseId);
      }
      
      // Fallback to default DATA if not found in storage
      if (!course) {
        course = getCourseById(courseId);
      }
      
      if (!course) {
        buildLayout('courses', `<div class="page-header"><h2>Course not found</h2></div><a href="courses.html" class="btn-primary">Back to Courses</a>`);
        return;
      }

      const courseAssignments = (SharedStore.getAssignments() || []).filter(a => a.courseId === course.id);
      const mySubmissions = SharedStore.getSubmissionsByStudent(DATA.student.id);
      
      let totalLessons = 0;
      let completedLessons = 0;
      if (course.modules) {
        course.modules.forEach(m => {
          if (m.lessons) {
            totalLessons += m.lessons.length;
            completedLessons += m.lessons.filter(l => l.completed).length;
          }
        });
      }
      
      const progressPct = totalLessons > 0 ? Math.round((completedLessons / totalLessons) * 100) : (course.progress || 0);

      const content = `
        <div class="breadcrumb">
          <a href="courses.html">Courses</a> <i class="fas fa-chevron-right"></i> <span>${escapeHtml(course.code)}</span>
        </div>

        <div class="course-detail-hero" style="background: linear-gradient(135deg, var(--primary), var(--primary-light));">
          <div class="course-detail-hero-content">
            <div class="course-detail-badge"><i class="fas ${course.icon}"></i> ${escapeHtml(course.code)} · ${escapeHtml(course.semester || 'Spring 2025')}</div>
            <h1>${escapeHtml(course.title)}</h1>
            <p>${escapeHtml(course.description)}</p>
            <div class="course-detail-stats">
              <div class="course-detail-stat"><div class="icon-box"><i class="fas fa-star"></i></div><div class="stat-info"><h4>${course.credits} Credits</h4><p>Weight</p></div></div>
              <div class="course-detail-stat"><div class="icon-box"><i class="fas fa-users"></i></div><div class="stat-info"><h4>${course.enrolled || 45}</h4><p>Enrolled</p></div></div>
              <div class="course-detail-stat"><div class="icon-box"><i class="fas fa-thumbs-up"></i></div><div class="stat-info"><h4>${course.rating || '4.8'}/5</h4><p>Rating</p></div></div>
            </div>
          </div>
        </div>

        <div class="course-tabs">
          <button class="course-tab active" onclick="switchTab('modules', this)"><i class="fas fa-list-ul"></i> Modules (${course.modules?.length || 0})</button>
          <button class="course-tab" onclick="switchTab('resources', this)"><i class="fas fa-folder-open"></i> Resources (${course.resources?.length || 0})</button>
          <button class="course-tab" onclick="switchTab('assignments', this)"><i class="fas fa-tasks"></i> Assignments (${courseAssignments.length})</button>
          <button class="course-tab" onclick="switchTab('announcements', this)"><i class="fas fa-bullhorn"></i> Announcements (${course.announcements?.length || 0})</button>
        </div>

        <!-- MODULES -->
        <div id="tab-modules" class="tab-content" style="display:block;">
          <div class="modules-list">
            ${(!course.modules || course.modules.length === 0) ? '<p style="text-align:center;padding:2rem;color:var(--text-light);">No modules uploaded yet.</p>' : course.modules.map(m => `
              <div class="module-card">
                <div class="module-header expanded">
                  <div class="module-icon"><i class="fas fa-folder"></i></div>
                  <div class="module-info">
                    <h4>${escapeHtml(m.title)}</h4>
                    <p>${escapeHtml(m.description || '')}</p>
                  </div>
                </div>
                <div class="module-body expanded">
                  ${(!m.lessons || m.lessons.length === 0) ? '<p style="padding:1rem;color:var(--text-light);">No lessons added in this module.</p>' : m.lessons.map(l => `
                    <div class="lesson-item">
                      <div class="lesson-check ${l.completed ? 'done' : ''}">${l.completed ? '<i class="fas fa-check"></i>' : ''}</div>
                      <div class="lesson-info"><h5>${escapeHtml(l.title)}</h5></div>
                      <div class="lesson-meta"><span class="type-badge ${l.type || 'reading'}">${l.type || 'reading'}</span></div>
                    </div>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- RESOURCES -->
        <div id="tab-resources" class="tab-content" style="display:none;">
          <div class="resources-grid">
            ${(!course.resources || course.resources.length === 0) ? '<p style="text-align:center;padding:2rem;color:var(--text-light);">No resources uploaded yet.</p>' : course.resources.map(r => `
              <div class="resource-card" onclick="showToast('Downloading ${escapeHtml(r.name)}...', 'info')">
                <div class="resource-icon ${r.type}"><i class="fas ${r.icon || 'fa-file'}"></i></div>
                <div class="resource-info"><h5>${escapeHtml(r.name)}</h5><p>${(r.type || 'PDF').toUpperCase()} · ${escapeHtml(r.size || '1 MB')}</p></div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- ASSIGNMENTS -->
        <div id="tab-assignments" class="tab-content" style="display:none;">
          <div class="assignments-list">
            ${courseAssignments.length === 0 ? '<p style="text-align:center;padding:2rem;color:var(--text-light);">No assignments yet.</p>' : courseAssignments.map(a => {
              const submitted = mySubmissions.find(s => s.assignmentId === a.id);
              return `
                <div class="assignment-item" style="cursor:pointer;" onclick="window.location.href='assignments.html'">
                  <div class="assignment-status ${submitted ? 'submitted' : 'pending'}"></div>
                  <div class="assignment-info"><h4>${escapeHtml(a.title)}</h4><p>Due: ${escapeHtml(a.due)}</p></div>
                  <div class="assignment-meta"><span class="badge ${submitted ? 'submitted' : 'pending'}">${submitted ? 'Submitted' : 'Pending'}</span></div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <!-- ANNOUNCEMENTS -->
        <div id="tab-announcements" class="tab-content" style="display:none;">
          <div class="announcements-list">
            ${(!course.announcements || course.announcements.length === 0) ? '<p style="text-align:center;padding:2rem;color:var(--text-light);">No announcements yet.</p>' : course.announcements.map(a => `
              <div class="teacher-announcement">
                <div class="ta-icon type-announcement"><i class="fas fa-bullhorn"></i></div>
                <div class="ta-content"><h4>${escapeHtml(a.title)}</h4><p>${escapeHtml(a.body)}</p><span class="ta-date">${escapeHtml(a.date)}</span></div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      
      buildLayout('courses', content);

      window.switchTab = (tabId, btn) => {
        document.querySelectorAll('.course-tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
        document.getElementById('tab-' + tabId).style.display = 'block';
      };
    });
  </script>
</body>
</html>
