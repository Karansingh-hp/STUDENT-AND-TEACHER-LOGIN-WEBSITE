<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance · Faculty Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root"></div>
  <div id="toast" class="toast"><i class="fas fa-check-circle"></i><span id="toastMessage">Success</span></div>
  <script src="script.js"></script>
  <script>
    if (!requireAuth('teacher')) throw new Error();
    const t = DATA.teacher;
    const course = t.courses.map(id => getCourseById(id)).filter(Boolean)[0];
    const students = course ? course.students : [];
    const content = `
      <div class="page-header"><h2><i class="fas fa-user-check"></i> Mark Attendance</h2><p>${course ? escapeHtml(course.code) + ' - ' + escapeHtml(course.title) : ''} · ${new Date().toLocaleDateString()}</p></div>
      <div class="dashboard-card">
        <div class="card-header"><h3><i class="fas fa-list-check"></i> Today's Attendance</h3>
          <div style="display:flex;gap:0.5rem;">
            <button class="tab-filter" onclick="markAllAttendance('present', '${course?.id || 'cs201'}')">All Present</button>
            <button class="tab-filter" onclick="markAllAttendance('absent', '${course?.id || 'cs201'}')">All Absent</button>
          </div>
        </div>
        <div class="attendance-list">
          ${students.map(s => `
            <div class="attendance-row">
              <div class="student-row" style="flex:1;border:none;background:transparent;padding:0;">
                <div class="student-avatar">${escapeHtml(s.name.split(' ').map(n => n[0]).join('').slice(0,2))}</div>
                <div class="student-info"><h5>${escapeHtml(s.name)}</h5><p>${escapeHtml(s.id)}</p></div>
              </div>
              <div class="attendance-actions">
                <button class="att-btn present" data-sid="${s.id}" onclick="markAttendance('${s.id}','present')">Present</button>
                <button class="att-btn late" data-sid="${s.id}" onclick="markAttendance('${s.id}','late')">Late</button>
                <button class="att-btn absent" data-sid="${s.id}" onclick="markAttendance('${s.id}','absent')">Absent</button>
              </div>
            </div>
          `).join('')}
        </div>
        <button class="btn-primary" style="margin-top:1.2rem;width:100%;justify-content:center;" onclick="submitAttendance()"><i class="fas fa-check-circle"></i> Submit Attendance</button>
      </div>
    `;
    buildLayout('teacher-attendance', content);
  </script>
</body>
</html>
