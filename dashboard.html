<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · Westfield Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="root"></div>
  <div id="toast" class="toast"><i class="fas fa-check-circle"></i><span id="toastMessage">Success</span></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/student-assignments.js"></script>
  <script src="js/teacher-assignments.js"></script>
  <script src="js/teacher-courses.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth('student')) return;
          // 🔥 Login wale student ka data uthao (sirf Alex nahi)
    const session = getCurrentUser();
    const currentStudent = session.user;

      // Shared storage se teacher ke diye assignments uthao
      const sharedAssignments = SharedStore.getAssignments();
      const mySubmissions = SharedStore.getSubmissionsByStudent(DATA.student.id);
      const myGrades = SharedStore.getGradesForStudent(DATA.student.id);

      // Sirf wo assignments dikhao jo pending hain (submit nahi hue)
      const pendingAssignments = sharedAssignments.filter(sa => {
        const submitted = mySubmissions.find(s => s.assignmentId === sa.id);
        return !submitted;
      }).slice(0, 3); // Top 3 dikhao

     const s = session.user;
      
      const content = `
        <div class="page-header">
          <h2><i class="fas fa-home"></i> Dashboard</h2>
          <p>Welcome back, ${escapeHtml(s.firstName)}. Here's your academic overview.</p>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
          ${DATA.stats.map(st => `
            <a href="${st.route}" class="stat-card">
              <div class="stat-icon ${st.color}"><i class="fas ${st.icon}"></i></div>
              <h3>${escapeHtml(st.label)}</h3>
              <div class="stat-value">${escapeHtml(st.value)}</div>
              <div class="stat-change"><i class="fas ${st.changeIcon}"></i> ${escapeHtml(st.change)}</div>
            </a>
          `).join('')}
        </div>

        <div class="dashboard-grid">
          <div>
            <!-- Today's Schedule -->
            <div class="dashboard-card">
              <div class="card-header">
                <h3><i class="fas fa-clock"></i> Today's Schedule</h3>
                <a href="timetable.html">View full timetable</a>
              </div>
              ${DATA.schedule.map(item => `
                <div class="schedule-item">
                  <div class="schedule-time">${escapeHtml(item.time)}</div>
                  <div class="schedule-info">
                    <h4>${escapeHtml(item.course)}</h4>
                    <p>${escapeHtml(item.instructor)} · ${escapeHtml(item.room)}</p>
                  </div>
                </div>
              `).join('')}
            </div>

            <!-- 🔥 New Upcoming Assignments Section -->
            <div class="dashboard-card">
              <div class="card-header">
                <h3><i class="fas fa-tasks"></i> Pending Assignments</h3>
                <a href="assignments.html">View all</a>
              </div>
              ${pendingAssignments.length === 0 ? `
                <div style="text-align:center; padding: 1.5rem; color: var(--text-light);">
                  <i class="fas fa-check-circle" style="font-size: 2rem; color: var(--success); margin-bottom: 0.5rem; display: block;"></i>
                  <p>No pending assignments. All caught up! 🎉</p>
                </div>
              ` : pendingAssignments.map(a => `
                <div class="assignment-item" style="cursor: pointer;" onclick="window.location.href='assignments.html'">
                  <div class="assignment-status pending"></div>
                  <div class="assignment-info">
                    <h4>${escapeHtml(a.title)}</h4>
                    <p>${escapeHtml(a.course)} · Due ${escapeHtml(a.due)}</p>
                  </div>
                  <div class="assignment-meta">
                    <span class="badge pending">Pending</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div>
            <!-- Announcements -->
            <div class="dashboard-card">
              <div class="card-header">
                <h3><i class="fas fa-bullhorn"></i> Announcements</h3>
              </div>
              ${DATA.announcements.map(a => `
                <div class="announcement-item">
                  <h4>${escapeHtml(a.title)}</h4>
                  <p>${escapeHtml(a.body)}</p>
                  <div class="date">${escapeHtml(a.date)}</div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
      
      buildLayout('dashboard', content);
    });
  </script>
</body>
</html>
