<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignments · Faculty Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="root"></div>
  <div id="toast" class="toast"><i class="fas fa-check-circle"></i><span id="toastMessage">Success</span></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/student-assignments.js"></script>
  <script src="js/teacher-assignments.js"></script>
  <script src="js/teacher-courses.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth('teacher')) return;
      const content = `
        <div class="page-header">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem;">
            <div>
              <h2><i class="fas fa-file-signature"></i> Assignments</h2>
              <p>Create, manage, and grade assignments across all your courses.</p>
            </div>
            <button class="btn-primary" onclick="openCreateAssignmentModal()">
              <i class="fas fa-plus"></i> Create Assignment
            </button>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-icon purple"><i class="fas fa-file-alt"></i></div><h3>Total</h3><div class="stat-value" id="tStatTotal">0</div></div>
          <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-unlock"></i></div><h3>Open</h3><div class="stat-value" id="tStatOpen">0</div></div>
          <div class="stat-card"><div class="stat-icon green"><i class="fas fa-paper-plane"></i></div><h3>Submissions</h3><div class="stat-value" id="tStatSubmissions">0</div></div>
          <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-hourglass-half"></i></div><h3>Pending Grade</h3><div class="stat-value" id="tStatPending">0</div></div>
        </div>
        <div class="tab-filters">
          <button class="tab-filter active" onclick="filterTeacherAssignments('all');setActiveTab(this)"><i class="fas fa-list"></i> All</button>
          <button class="tab-filter" onclick="filterTeacherAssignments('open');setActiveTab(this)"><i class="fas fa-unlock"></i> Open</button>
          <button class="tab-filter" onclick="filterTeacherAssignments('draft');setActiveTab(this)"><i class="fas fa-file"></i> Draft</button>
        </div>
        <div class="assignments-count-bar"><span id="teacherAssignmentsCount" style="font-size:0.82rem;color:var(--text-light);font-weight:600;"></span></div>
        <div class="teacher-assignments-list" id="teacherAssignmentsList"></div>
      `;
      buildLayout('teacher-assignments', content);
      initTeacherAssignmentsPage();

      function setActiveTab(btn) {
        document.querySelectorAll('.tab-filter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
    });
  </script>
</body>
</html>
