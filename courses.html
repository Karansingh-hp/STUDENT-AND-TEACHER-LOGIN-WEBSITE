<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses · Westfield Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root"></div>
  <div id="toast" class="toast"><i class="fas fa-check-circle"></i><span id="toastMessage">Success</span></div>
  <script src="script.js"></script>
  <script>
    if (!requireAuth('student')) throw new Error();
    const content = `
      <div class="page-header">
        <h2><i class="fas fa-book"></i> My Courses</h2>
        <p>View your enrolled courses, track progress, and access materials.</p>
      </div>
      <div class="tab-filters">
        <button class="tab-filter active">All (${DATA.courses.length})</button>
      </div>
      <div class="courses-grid">
        ${DATA.courses.map(c => {
          const comp = c.modules.reduce((s, m) => s + m.lessons.filter(l => l.completed).length, 0);
          const total = c.modules.reduce((s, m) => s + m.lessons.length, 0);
          return `
            <a href="course-detail.html?id=${c.id}" class="course-card">
              <div class="course-banner ${c.theme}">
                <i class="fas ${c.icon}"></i>
                <span class="credit-badge">${c.credits} Credits</span>
              </div>
              <div class="course-content">
                <div class="course-code">${escapeHtml(c.code)} · ${escapeHtml(c.schedule)}</div>
                <h3>${escapeHtml(c.title)}</h3>
                <p>${escapeHtml(c.description)}</p>
                <div class="course-meta">
                  <span><i class="fas fa-user"></i> ${escapeHtml(c.instructor)}</span>
                  <span><i class="fas fa-award"></i> ${escapeHtml(c.grade)}</span>
                </div>
                <div class="progress-bar"><div class="progress" style="width:${c.progress}%;"></div></div>
                <div class="progress-text"><span>${comp}/${total} lessons</span><span>${c.progress}% complete</span></div>
              </div>
            </a>
          `;
        }).join('')}
      </div>
    `;
    buildLayout('courses', content);
  </script>
</body>
</html>
