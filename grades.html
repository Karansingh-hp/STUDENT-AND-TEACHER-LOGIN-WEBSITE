<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grades · Westfield Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="root"></div>
  <div id="toast" class="toast"><i class="fas fa-check-circle"></i><span id="toastMessage">Success</span></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/student-assignments.js"></script>
  <script src="js/teacher-assignments.js"></script>
  <script src="js/teacher-courses.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth('student')) return;

      // 1. Shared Storage se grades aur submissions uthao
      const myGrades = SharedStore.getGradesForStudent(DATA.student.id);
      const sharedAssignments = SharedStore.getAssignments();

      // 2. Course wise grades aur assignments merge karo
      const courseGradesMap = {};

      // Pehle default grades daalo (jo data.js mein hain)
      (DATA.grades || []).forEach(g => {
        courseGradesMap[g.course] = {
          course: g.course,
          title: g.title,
          credits: g.credits,
          midterm: g.midterm,
          final: g.final,
          grade: g.grade,
          points: g.points,
          assignments: []
        };
      });

      // Ab assignments ke base pe naye grades add karo
      sharedAssignments.forEach(sa => {
        // Check karo ki student ne is assignment ko submit kiya hai kya
        const grade = myGrades.find(g => g.assignmentId === sa.id);
        
        // Agar student ne submit kiya hai ya grade mila hai
        if (grade) {
          if (!courseGradesMap[sa.course]) {
            courseGradesMap[sa.course] = {
              course: sa.course,
              title: sa.title,
              credits: 4, // Default
              midterm: '—',
              final: '—',
              grade: '—',
              points: 0,
              assignments: []
            };
          }
          
          // Assignment details push karo
          courseGradesMap[sa.course].assignments.push({
            id: sa.id,
            title: sa.title,
            points: sa.points,
            earned: grade.score,
            feedback: grade.feedback,
            date: grade.gradedAt
          });
        }
      });

      // 3. Calculate Stats
      const gradeList = Object.values(courseGradesMap);
      let totalCredits = 0;
      let totalPoints = 0;

      // GPA aur marks calculate karo
      gradeList.forEach(g => {
        totalCredits += g.credits;
        
        // Agar assignment ke marks hain, toh unka average le lo
        if (g.assignments && g.assignments.length > 0) {
          let earned = 0;
          let total = 0;
          g.assignments.forEach(a => {
            earned += a.earned;
            total += a.points;
          });
          
          // Percentage nikaalo
          const pct = (earned / total) * 100;
          
          // Grade aur Points calculate karo (Simple logic)
          if (pct >= 90) { g.grade = 'A'; g.points = 4.0; }
          else if (pct >= 80) { g.grade = 'B+'; g.points = 3.3; }
          else if (pct >= 70) { g.grade = 'B'; g.points = 3.0; }
          else if (pct >= 60) { g.grade = 'C'; g.points = 2.0; }
          else { g.grade = 'F'; g.points = 0.0; }
        }

        totalPoints += (g.points * g.credits);
      });

      const cgpa = totalCredits > 0 ? (totalPoints / totalCredits).toFixed(2) : '0.00';
      const totalEarnedPoints = gradeList.reduce((sum, g) => {
        if (g.assignments) {
          return sum + g.assignments.reduce((s, a) => s + a.earned, 0);
        }
        return sum;
      }, 0);

      const content = `
        <div class="page-header">
          <h2><i class="fas fa-chart-line"></i> Grades & Performance</h2>
          <p>Your academic performance this semester.</p>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon green"><i class="fas fa-chart-line"></i></div>
            <h3>Current GPA</h3>
            <div class="stat-value">${cgpa}</div>
            <div class="stat-change"><i class="fas fa-arrow-up"></i> Based on current grades</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon blue"><i class="fas fa-award"></i></div>
            <h3>Total Credits</h3>
            <div class="stat-value">${totalCredits}</div>
            <div class="stat-change"><i class="fas fa-info-circle"></i> Across all courses</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon purple"><i class="fas fa-star"></i></div>
            <h3>Earned Points</h3>
            <div class="stat-value">${totalEarnedPoints}</div>
            <div class="stat-change"><i class="fas fa-check-circle"></i> From graded assignments</div>
          </div>
        </div>

        <!-- Course Grades Table -->
        <div class="dashboard-card">
          <div class="card-header">
            <h3><i class="fas fa-table"></i> Course Grades</h3>
          </div>
          <div style="overflow-x:auto;">
            <table class="grades-table">
              <thead>
                <tr>
                  <th>Code</th>
                  <th>Course</th>
                  <th>Credits</th>
                  <th>Grade</th>
                  <th>Points</th>
                </tr>
              </thead>
              <tbody>
                ${gradeList.map(g => `
                  <tr>
                    <td><strong>${escapeHtml(g.course)}</strong></td>
                    <td>${escapeHtml(g.title)}</td>
                    <td>${g.credits}</td>
                    <td><span class="grade-badge ${g.grade.startsWith('A') ? 'a' : g.grade.startsWith('B') ? 'b' : 'c'}">${escapeHtml(g.grade)}</span></td>
                    <td>${g.points.toFixed(1)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <!-- Assignment Breakdown -->
        <div class="dashboard-card" style="margin-top: 2rem;">
          <div class="card-header">
            <h3><i class="fas fa-tasks"></i> Assignment Scores</h3>
          </div>
          
          ${gradeList.map(g => {
            if (!g.assignments || g.assignments.length === 0) return '';
            return `
              <div style="margin-bottom: 1.5rem;">
                <h4 style="font-size: 0.95rem; color: var(--primary); margin-bottom: 0.8rem; padding-bottom: 0.4rem; border-bottom: 1px solid var(--border);">${escapeHtml(g.course)} - ${escapeHtml(g.title)}</h4>
                <div class="assignments-list">
                  ${g.assignments.map(a => `
                    <div class="assignment-item" style="background: #f8fafc;">
                      <div class="assignment-info">
                        <h4>${escapeHtml(a.title)}</h4>
                        <p>Graded on: ${new Date(a.date).toLocaleDateString()}</p>
                        ${a.feedback ? `<p style="font-size: 0.75rem; color: var(--text-light); font-style: italic; margin-top: 0.2rem;">"${escapeHtml(a.feedback)}"</p>` : ''}
                      </div>
                      <div class="assignment-meta" style="text-align: right;">
                        <div style="font-size: 1.1rem; font-weight: 700; color: var(--success);">${a.earned} / ${a.points}</div>
                        <div style="font-size: 0.7rem; color: var(--text-light);">${Math.round((a.earned/a.points)*100)}%</div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            `;
          }).join('')}

          ${gradeList.every(g => !g.assignments || g.assignments.length === 0) ? `
            <div style="text-align: center; padding: 2rem; color: var(--text-light);">
              <i class="fas fa-file-signature" style="font-size: 2.5rem; color: #c8d4e3; margin-bottom: 1rem; display: block;"></i>
              <p>No assignment scores yet. Submit your assignments to see them here!</p>
            </div>
          ` : ''}
        </div>
      `;
      
      buildLayout('grades', content);
    });
  </script>
</body>
</html>
