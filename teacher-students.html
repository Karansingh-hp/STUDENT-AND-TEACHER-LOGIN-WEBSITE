<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students · Faculty Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root"></div>
  <div id="toast" class="toast"><i class="fas fa-check-circle"></i><span id="toastMessage">Success</span></div>
  <script src="script.js"></script>
  <script>
    if (!requireAuth('teacher')) throw new Error();
    const t = DATA.teacher;
    const myCourses = t.courses.map(id => getCourseById(id)).filter(Boolean);
    const allStudents = []; const seen = new Set();
    myCourses.forEach(c => c.students.forEach(s => { if (!seen.has(s.id)) { seen.add(s.id); allStudents.push({ ...s, course: c.code }); } }));
    const content = `
      <div class="page-header"><h2><i class="fas fa-users"></i> My Students</h2><p>All students enrolled in your courses (${allStudents.length} total).</p></div>
      <div class="dashboard-card">
        <div class="card-header"><h3><i class="fas fa-list"></i> Student Roster</h3></div>
        <div class="student-list">
          ${allStudents.map(s => `
            <div class="student-row">
              <div class="student-avatar">${escapeHtml(s.name.split(' ').map(n => n[0]).join('').slice(0,2))}</div>
              <div class="student-info"><h5>${escapeHtml(s.name)}</h5><p>${escapeHtml(s.id)} · ${escapeHtml(s.course)} · Attendance: ${s.attendance}%</p></div>
              <span class="student-grade ${s.grade.startsWith('A') ? 'a' : s.grade.startsWith('B') ? 'b' : s.grade.startsWith('C') ? 'c' : 'd'}">${escapeHtml(s.grade)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    buildLayout('teacher-students', content);
  </script>
</body>
</html>
